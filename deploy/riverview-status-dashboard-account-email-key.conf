# Riverview~ controlled opt-in credential drop-in.
# Revision: 1.0.0
# Install only after /etc/riverview/account-email-config.key exists as a root-owned 0600 file.
# This file does not change SMTP settings or start a delivery workflow.
[Service]
LoadCredential=account-email-config-key:/etc/riverview/account-email-config.key
