# Riverview controlled Nginx include
# File: deploy/nginx/riverview-v2.location.conf
# Component: RIVERVIEW-V2-WORKSPACE-SHELL
# Revision: 1.0.1
# Purpose: LAN-only same-origin static V2 mount for the Communications Activity release
# Execution Model: Request-driven Nginx static delivery
# Observability: Nginx access/error logs and HTTPS response headers
# Dependencies: Existing LAN-only TLS server; versioned static release under /var/www/riverview-v2-preview/releases
# Inputs/Outputs: GET/HEAD /v2/ and assets; browser calls same-origin /api/v1 endpoints
# Authority: Presentation only; Dashboard account cookie, CSRF checks and exact conversation grants authorize API operations
# Changed: 2026-10-21 UTC | RV-WEB-V2-COMMS-ACTIVITY-001 | Point only the V2 alias at its immutable activity-monitor release
# Contracts: docs/components/RIVERVIEW_V2_WORKSPACE_SHELL.md
# Tests: tests/test_v2_workspace_shell.py; LAN Chrome acceptance evidence
# History: Git and revision/backup manifest; deployed predecessor in protected task backup

location = /v2 {
    return 308 /v2/;
}

location ^~ /v2/ {
    alias /var/www/riverview-v2-preview/releases/RV-WEB-V2-COMMS-ACTIVITY-001/;
    index index.html;
    autoindex off;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
}
