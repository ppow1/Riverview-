# Revision: 1.0.0
# Secret-free, read-only automated verification projection; visible only through
# the existing LAN-restricted Riverview HTTPS server.
location = /v2/verification/latest.json {
    alias /var/lib/riverview-website-acceptance/latest.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
