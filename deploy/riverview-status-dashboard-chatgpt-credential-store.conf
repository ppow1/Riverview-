# Riverview controlled, narrowly scoped identity-credential destination.
# Revision: 1.0.0
# Install only after creating the directory root:riverview 0700 and then
# assigning it to riverview:riverview 0700. Rollback: remove this drop-in and
# restart riverview-status-dashboard.service; retain the credential file.
[Service]
ReadWritePaths=/var/lib/riverview-status-dashboard/identity-credentials
