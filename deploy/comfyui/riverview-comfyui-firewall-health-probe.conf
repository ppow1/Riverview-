# Permit only OCTOMINER1 itself to probe its bound ComfyUI listener for health.
# This precedes the existing LAN allowlist/drop rules and does not admit remote hosts.
[Service]
ExecStartPre=/bin/sh -ec '/usr/sbin/iptables-legacy -C INPUT -p tcp -s 192.168.1.160 -d 192.168.1.160 --dport 8188 -j ACCEPT || /usr/sbin/iptables-legacy -I INPUT 1 -p tcp -s 192.168.1.160 -d 192.168.1.160 --dport 8188 -j ACCEPT'
