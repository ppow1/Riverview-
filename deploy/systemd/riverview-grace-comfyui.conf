# Riverview~ controlled opt-in for existing Grace Engineering worker.
# Revision: 1.0.0
[Service]
Environment=RIVERVIEW_COMFYUI_ENABLED=1
Environment=RIVERVIEW_COMFYUI_ENDPOINT=http://192.168.1.160:8188
Environment=RIVERVIEW_COMFYUI_WORKFLOW_REGISTRY=/etc/riverview/comfyui/workflows.json
Environment=RIVERVIEW_COMFYUI_STATE_DIR=/var/lib/riverview-grace-owner-session/comfyui-state
Environment=RIVERVIEW_COMFYUI_ARTIFACT_DIR=/var/lib/riverview-comfyui/artifacts
Environment=RIVERVIEW_COMFYUI_ARTIFACT_GROUP=riverview
Environment=RIVERVIEW_COMFYUI_TIMEOUT_SECONDS=900
Environment=RIVERVIEW_COMFYUI_POLL_SECONDS=1
SupplementaryGroups=riverview
ReadWritePaths=/var/lib/riverview-comfyui
