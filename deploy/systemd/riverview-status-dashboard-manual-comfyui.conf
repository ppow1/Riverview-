# Riverview controlled systemd drop-in
# File Revision: 1.0.1
# Component: V2-MANUAL-IMAGE-GENERATION
# Purpose: Configure the existing Dashboard process for authenticated manual ComfyUI requests
# Authority: Fixed worker endpoint; no service or GPU management authority
# Changed: 2026-10-23 UTC | RV-ISSUE-256 | Load the registry from the active Dashboard release so registered V2 workflows deploy atomically with that release.
[Service]
Environment=RIVERVIEW_COMFYUI_MANUAL_ENABLED=1
Environment=RIVERVIEW_COMFYUI_ENDPOINT=http://192.168.1.160:8188
Environment=RIVERVIEW_COMFYUI_WORKFLOW_REGISTRY=/opt/riverview-status-dashboard/current/deploy/comfyui/workflows.json
Environment=RIVERVIEW_COMFYUI_MANUAL_ARTIFACT_ROOT=/var/lib/riverview-status-dashboard/manual-image/artifacts
Environment=RIVERVIEW_COMFYUI_MANUAL_STATE_ROOT=/var/lib/riverview-status-dashboard/manual-image/state
Environment=RIVERVIEW_COMFYUI_MANUAL_ARTIFACT_GROUP=riverview
Environment=RIVERVIEW_COMFYUI_TIMEOUT_SECONDS=900
Environment=RIVERVIEW_COMFYUI_POLL_SECONDS=1
ReadWritePaths=/var/lib/riverview-status-dashboard/manual-image
