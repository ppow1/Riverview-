# Riverview~ controlled source
# File Revision: 1.0.0
# Task: RV-GRACE-DUAL-CAPABILITY-001
# Purpose: Optional source-change worker enrollment drop-in; install only after Steward-approved provisioning
# Changed: 2026-10-18 UTC | RV-GRACE-DUAL-CAPABILITY-001 | Bind a distinct source worker identity and protected credential
# Security: Does not replace the artifact worker credential; expects a separately provisioned source credential
# =============================================================================
[Service]
Environment=RIVERVIEW_SOURCE_WORKER_ENABLED=1
# Set the reviewed active registration identity during enrollment.
Environment=RIVERVIEW_SOURCE_WORKER_ID=worker:grace-source-change
LoadCredential=source-worker-token:/etc/riverview/worker/grace-source-change.credential
