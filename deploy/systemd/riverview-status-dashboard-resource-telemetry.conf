# Revision: 1.0.0
# Dedicated read-only GPU telemetry credentials for the authenticated Dashboard projection.
# The SSH key is separately forced by the GPU host to one fixed collector command.
[Service]
LoadCredential=resource-telemetry-key:/etc/riverview/resource-telemetry/telemetry_ed25519
LoadCredential=resource-telemetry-known-hosts:/etc/riverview/resource-telemetry/known_hosts
