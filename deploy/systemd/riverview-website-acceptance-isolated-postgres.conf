# Riverview~ controlled systemd drop-in
# File: deploy/systemd/riverview-website-acceptance-isolated-postgres.conf
# Component: RIVERVIEW-WEBSITE-ACCEPTANCE
# Revision: 1.0.0
# Purpose: Permit pg_virtualenv to create its disposable cluster inside the acceptance service sandbox.
# Execution Model: Private temporary files; request-driven browser tests.
# Authority: CAP_CHOWN and CAP_SETGID only; no CAP_SETUID, database credentials, or production DB mutation authority.
# Changed: 2026-10-26 UTC | RV-ISSUE268-SYSTEMD-CHROME-ACCEPTANCE | Allow writable PrivateTmp and bounded ownership/group setup for isolated PostgreSQL.
# Contracts: Existing riverview-website-acceptance@.service with PrivateTmp, ProtectSystem=strict, NoNewPrivileges, and ReadWritePaths to the report directory.
# Tests: scripts/run_isolated_website_acceptance_suite.py under the existing protected systemd persona.
# History: Git and .riverview-backups/manifest.jsonl.
[Service]
ReadWritePaths=/tmp
AmbientCapabilities=CAP_CHOWN CAP_SETGID
CapabilityBoundingSet=CAP_CHOWN CAP_SETGID
