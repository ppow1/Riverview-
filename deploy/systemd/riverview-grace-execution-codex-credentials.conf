# Riverview~ controlled systemd drop-in
# File: deploy/systemd/riverview-grace-execution-codex-credentials.conf
# Component: RESIDENT-ORCHESTRATION
# Revision: 1.0.0
# Purpose: Provide the dedicated Codex API key only when Codex execution is commissioned
# Execution Model: Explicit systemd drop-in for riverview-grace-execution.service
# Observability: Credential appears only in the service credential directory
# Dependencies: /etc/riverview/codex/api-key.credential; systemd LoadCredential
# Authority: Dedicated service credential; never admin1 personal credentials
# Changed: 2026-10-13 UTC | RV-GRACE-CODEX-CREDENTIAL-DROPOIN | Isolate Codex key from base Grace worker mode
# Contracts: docs/components/GRACE_EXECUTION_PIPELINE.md
# Tests: systemd-analyze verify
# History: Git and .riverview-backups/manifest.jsonl
# =============================================================================
[Service]
LoadCredential=codex-api-key:/etc/riverview/codex/api-key.credential
