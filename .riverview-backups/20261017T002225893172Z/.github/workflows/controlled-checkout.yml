# =============================================================================
# RIVERVIEW~ CONTROLLED CONFIGURATION
# File: .github/workflows/controlled-checkout.yml
# Component: ENG-REVISION-CONTROL
# Revision: 1.0.5
# Purpose: Enforce full tests and file revision/backup checkout on GitHub changes
# Execution Model: Event-driven on pull_request and push
# Observability: GitHub Actions job result and test output
# Dependencies: GitHub-hosted Ubuntu; Python 3.12; PostgreSQL 16 service
# Authority: Read-only repository checkout; ephemeral test database only
# Changed: 2026-10-10 UTC | RV-GRAPH-001 | Install graph schema validator and enforce generated graph synchronization
# Changed: 2026-10-17 UTC | RV-MCP-CHATGPT-OAUTH-RESOURCE-001 | Install pinned PyJWT support for OAuth MCP resource-token validation
# Contracts: docs/standards/DEVELOPMENT_LIFECYCLE_STANDARD.md
# Tests: Full unittest discovery and revision-control checkout
# History: Git and .riverview-backups/manifest.jsonl
# =============================================================================
name: Controlled checkout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  controlled-checkout:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: riverview_test
          POSTGRES_USER: riverview_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riverview_test -d riverview_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RIVERVIEW_TEST_PG_DSN: postgresql://riverview_test@127.0.0.1:5432/riverview_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test and graph validation dependencies
        run: python -m pip install "psycopg[binary]==3.2.10" "jsonschema==4.10.3" "cryptography==41.0.7" "PyJWT[crypto]==2.10.1"
      - name: Run complete test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Verify canonical process graphs and generated views
        run: python scripts/process_graph.py check
      - name: Verify controlled revisions and preserved predecessors
        run: >-
          python scripts/revision_control.py check
          --baseline evidence/checkouts/ENG-REVISION-CONTROL/20261010T1530Z-27a8c55/baseline-inventory.json
